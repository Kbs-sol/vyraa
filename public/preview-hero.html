<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vyra Hero - Minimal Visual Flow Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f8f4ec;
    --paper: #fffdf8;
    --ink: #1b281e;
    --muted: #667064;
    --line: #e6dfd0;
    --sand: #eed3a8;
    --leaf: #2d7a3a;
    --serif: 'Newsreader', Georgia, serif;
    --sans: 'Archivo', -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #eef2ed;
    font-family: var(--sans);
    color: var(--ink);
    padding: 20px 14px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .mode-switch {
    margin-bottom: 14px;
    display: flex;
    gap: 10px;
  }
  .mode-btn {
    background: #fff;
    border: 1px solid #ccd5cc;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .mode-btn.active {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }

  /* Hero Section Container */
  .hero-container {
    width: 100%;
    max-width: 960px;
    background: var(--cream);
    border-radius: 24px;
    border: 1px solid var(--line);
    overflow: hidden;
    box-shadow: 0 16px 40px -15px rgba(27, 40, 30, 0.14);
    transition: max-width 0.3s ease;
  }

  /* 1. Large Auto-Looping Before/After Image Showcase */
  .hero-showcase {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 11;
    min-height: 340px;
    max-height: 520px;
    background: #000;
    overflow: hidden;
  }
  @media (max-width: 600px) {
    .hero-showcase {
      aspect-ratio: 1 / 1;
      min-height: 320px;
      max-height: none;
    }
  }

  .slide-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: bottom center;
    opacity: 0;
    transition: opacity 0.8s ease-in-out;
  }
  #img-0 {
    object-position: center center;
  }
  #img-1 {
    object-position: bottom center;
  }
  .slide-img.active {
    opacity: 1;
  }

  /* Minimal Loop Indicators */
  .loop-dots {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 5;
    background: rgba(0, 0, 0, 0.35);
    padding: 4px 10px;
    border-radius: 999px;
    backdrop-filter: blur(4px);
  }
  .loop-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.5);
    border: none;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .loop-dot.active {
    width: 24px;
    border-radius: 999px;
    background: #fff;
  }

  /* 2. Integrated Combo Product Strip (Right under the image inside the hero) */
  .hero-combo-bar {
    background: var(--paper);
    border-top: 1px solid var(--line);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  @media (max-width: 680px) {
    .hero-combo-bar {
      flex-direction: column;
      align-items: stretch;
      padding: 16px;
      gap: 14px;
    }
  }

  /* Product Info Snippet */
  .combo-item {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .combo-thumb {
    width: 64px;
    height: 64px;
    border-radius: 12px;
    object-fit: cover;
    border: 1px solid var(--line);
    background: var(--cream);
    flex-shrink: 0;
  }
  .combo-meta h2 {
    font-family: var(--serif);
    font-size: 19px;
    font-weight: 600;
    line-height: 1.2;
    color: var(--ink);
  }
  .combo-prices {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-top: 3px;
  }
  .price-now {
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
  }
  .price-mrp {
    font-size: 13px;
    color: var(--muted);
    text-decoration: line-through;
  }
  .discount-tag {
    background: #e4f4e7;
    color: var(--leaf);
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
  }

  /* Action Buttons */
  .combo-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  @media (max-width: 680px) {
    .combo-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
    }
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 44px;
    padding: 0 18px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    border: 1.5px solid var(--ink);
    transition: all 0.2s ease;
    white-space: nowrap;
  }
  .btn-outline {
    background: transparent;
    color: var(--ink);
  }
  .btn-outline:hover {
    background: var(--ink);
    color: #fff;
  }
  .btn-primary {
    background: var(--ink);
    color: #fff;
  }
  .btn-primary:hover {
    background: #2a3d2e;
  }
</style>
</head>
<body>

  <div class="mode-switch">
    <button class="mode-btn active" onclick="setMode('desktop')">Desktop View</button>
    <button class="mode-btn" onclick="setMode('mobile')">Mobile (390px)</button>
  </div>

  <div class="hero-container" id="heroBox">
    
    <!-- 1. Pure Before / After Image Loop (Zero Clutter, Zero Extra Text) -->
    <div class="hero-showcase">
      <img id="img-0" class="slide-img active" src="/static/img/ba/hero-ba-1.jpeg" alt="Customer transformation">
      <img id="img-1" class="slide-img" src="/static/img/ba/hero-ba-2.jpeg" alt="Customer transformation">
      
      <!-- Subtle Looping Dots -->
      <div class="loop-dots">
        <button class="loop-dot active" onclick="setSlide(0)"></button>
        <button class="loop-dot" onclick="setSlide(1)"></button>
      </div>
    </div>

    <!-- 2. Integrated Combo Kit Direct Purchase -->
    <div class="hero-combo-bar">
      <div class="combo-item">
        <img class="combo-thumb" src="/static/img/p/vyra-all-in-one-hair-growth-kit-1.webp" alt="Vyra All-in-One Hair Growth Kit">
        <div class="combo-meta">
          <h2>Vyra All-in-One Hair Growth Kit</h2>
          <div class="combo-prices">
            <span class="price-now">₹1,099</span>
            <span class="price-mrp">₹2,042</span>
            <span class="discount-tag">46% OFF</span>
          </div>
        </div>
      </div>

      <div class="combo-actions">
        <button type="button" class="btn btn-outline" onclick="alert('Added Kit to Bag!')">
          Add to bag
        </button>
        <a href="/product/vyra-all-in-one-hair-growth-kit" class="btn btn-primary">
          Buy now
        </a>
      </div>
    </div>

  </div>

  <script>
    let cur = 0;
    const total = 2;
    const imgs = [document.getElementById('img-0'), document.getElementById('img-1')];
    const dots = document.querySelectorAll('.loop-dot');

    function setSlide(idx) {
      imgs[cur].classList.remove('active');
      dots[cur].classList.remove('active');
      cur = idx;
      imgs[cur].classList.add('active');
      dots[cur].classList.add('active');
    }

    // Auto-loop every 3.5 seconds
    setInterval(() => {
      const next = (cur + 1) % total;
      setSlide(next);
    }, 3500);

    function setMode(mode) {
      const box = document.getElementById('heroBox');
      const btns = document.querySelectorAll('.mode-btn');
      btns.forEach(b => b.classList.remove('active'));
      if (mode === 'mobile') {
        box.style.maxWidth = '390px';
        btns[1].classList.add('active');
      } else {
        box.style.maxWidth = '960px';
        btns[0].classList.add('active');
      }
    }
  </script>
</body>
</html>
